name: Bootstrap Lockfiles

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  generate-lockfiles:
    name: Generate dependency lockfiles
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
          else
            git commit -m "chore: commit dependency lockfiles [skip ci]"
            git push origin HEAD:develop
          fi
