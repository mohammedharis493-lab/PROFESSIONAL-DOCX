name: Bootstrap Rust Lockfile

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  generate-rust-lockfile:
    name: Generate Cargo lockfile
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit Cargo lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current."
          else
            git commit -m "chore: update Rust dependency lockfile [skip ci]"
            git push origin HEAD:develop
          fi
