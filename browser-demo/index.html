adius:9px;font-weight:bold;color:#526278}.search-box{flex:1;display:flex;align-items:center;gap:10px;border:1px solid #dce3ed;background:#f8fafc;padding:11px 14px;border-radius:10px;min-width:0}.search-box input{width:100%;border:0;background:transparent;outline:0;color:#132037;min-width:0;font-size:14px}.kbd{font-size:10px;background:#fff;border:1px solid #e2e8f0;border-radius:5px;padding:3px 6px;color:#728096;white-space:nowrap}.demo-pill{border:1px solid #f3d3a6;background:#fffbf1;color:#9a5807;font-size:11px;font-weight:800;padding:7px 11px;border-radius:99px;white-space:nowrap}.workspace{padding:38px 42px 60px;max-width:1300px;margin:0 auto}.eyebrow{font-size:11px;letter-spacing:.17em;color:#617084;font-weight:800;margin:0 0 12px}.heading{font-size:clamp(30px,3vw,43px);letter-spacing:-.045em;line-height:1.08;font-weight:780;margin:0 0 13px;color:#111827}.lead{font-size:14px;line-height:1.7;max-width:780px;color:#657185;margin:0 0 27px}.notice{display:flex;align-items:flex-start;gap:10px;background:#fff8eb;border:1px solid #f1dfbb;color:#805b27;border-radius:11px;font-size:12px;line-height:1.55;padding:13px 15px;margin:0 0 27px}.notice strong{color:#7a4e17}.action{background:#111827;border:1px solid #111827;color:#fff;border-radius:9px;padding:11px 16px;font-size:13px;font-weight:750}.action:hover{background:#263447}.action.secondary{background:#fff;border-color:#dbe1eb;color:#344156}.action.secondary:hover{background:#f7f9fc}.action.ghost{background:transparent;border-color:transparent;color:#344156}.action.small{padding:7px 10px;font-size:12px}.action:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}.stat{background:white;border:1px solid #e4e9f2;border-radius:12px;padding:19px 19px 18px}.stat .statlabel{display:block;color:#748095;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.07em}.stat strong{display:block;margin:8px 0 1px;font-size:28px;letter-spacing:-.04em;color:#111827}.stat small{color:#8693a5;font-size:11px}.card{background:#fff;border:1px solid #e3e8f1;border-radius:13px;overflow:hidden;margin-bottom:18px}.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 21px;border-bottom:1px solid #edf0f5}.card-header h2{font-size:16px;margin:0;color:#172033;letter-spacing:-.02em}.card-header small{color:#8491a3;font-size:12px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:10px;color:#718097;letter-spacing:.09em;text-transform:uppercase;background:#f9fbfe;font-weight:800}th,td{padding:14px 16px;border-bottom:1px solid #edf0f4}tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:#fafcff}.filename{font-weight:750;color:#202d40;font-size:13px;display:block}.path{font-size:11px;color:#8290a3;display:block;margin-top:4px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#6f7e91;font-size:12px}.doctype{border-radius:6px;background:#eef3fa;color:#526885;padding:4px 6px;font-weight:800;font-size:10px}.icon-btn{border:1px solid #e0e5ed;background:#fff;border-radius:7px;padding:6px 9px;color:#46566e}.icon-btn:hover{background:#f2f6fd}.icon-btn.pinned{background:#fdf6de;border-color:#edd49a;color:#865c08}.empty{text-align:center;padding:45px 25px;color:#718098;font-size:13px;line-height:1.7}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.quick{background:#fff;border:1px solid #e4eaf3;border-radius:12px;padding:23px;cursor:pointer;text-align:left;min-height:166px}.quick:hover{border-color:#aebdcf;box-shadow:0 8px 24px #1524420c}.quick .num{font-size:12px;color:#91a0b4;font-weight:800}.quick h3{font-size:17px;letter-spacing:-.035em;margin:24px 0 8px}.quick p{color:#78869a;font-size:12px;line-height:1.6;margin:0}.mini-filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}.filter{background:#fff;color:#506176;border:1px solid #dce3ec;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}.filter.selected{background:#202f44;border-color:#202f44;color:#fff}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.client-card{background:#fff;border:1px solid #e2e8f1;border-radius:13px;padding:20px;cursor:pointer}.client-card:hover{border-color:#95a8be}.client-card h3{margin:0 0 8px;font-size:17px}.client-card p{margin:0;color:#7a8799;font-size:12px}.client-card .lower{border-top:1px solid #eef1f5;margin-top:23px;padding-top:14px;color:#5a6b82;font-size:11px;display:flex;justify-content:space-between}.tag{display:inline-block;background:#edf6f0;color:#2d7658;border-radius:6px;padding:5px 7px;font-size:11px;font-weight:750}.tag.amber{background:#fff3e4;color:#a36b20}.detail-top{display:flex;justify-content:space-between;gap:20px}.pill{display:inline-block;border-radius:7px;background:#edf2f9;padding:6px 9px;color:#52657d;font-size:11px;font-weight:750}.flexrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.muted{color:#7b899a}.preview{border:1px solid #e4e9f2;border-radius:9px;background:#f9fafc;padding:23px;max-width:840px}.preview-paper{background:#fff;min-height:280px;border:1px solid #e7ecf3;border-radius:5px;padding:30px;box-shadow:0 5px 20px #1b2e4d08}.preview-paper h3{font-size:20px;letter-spacing:-.03em;margin:0 0 22px}.preview-paper p{line-height:1.8;font-size:12px;color:#43516a}.preview-paper .fake-line{height:8px;background:#edf1f7;border-radius:6px;margin:13px 0}.dim{color:#94a2b4}.modal-backdrop{position:fixed;inset:0;background:#10203982;z-index:20;display:grid;place-items:center;padding:20px}.modal{background:#fff;width:min(820px,100%);max-height:90vh;overflow:auto;border-radius:15px;box-shadow:0 25px 65px #10203940}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:23px 26px;border-bottom:1px solid #e9eef5}.modal-head h2{margin:0;font-size:20px;letter-spacing:-.03em}.modal-body{padding:26px}.close{border:0;background:#eef2f8;border-radius:9px;height:34px;width:34px;font-size:17px;color:#3e4d61}.fieldlabel{font-size:12px;font-weight:800;color:#4e5e75;margin-bottom:8px;display:block}.fieldinput{width:100%;border:1px solid #dce3ed;border-radius:8px;padding:11px 13px;background:#fff;color:#1e293b}.footer{margin-top:36px;border-top:1px solid #e4e9f0;padding-top:18px;font-size:11px;color:#8290a4;line-height:1.6}.searchhist{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 20px;border-bottom:1px solid #edf0f5}.searchhist:last-child{border:0}.searchhist strong{font-size:13px}.searchhist p{margin:5px 0 0;color:#8190a2;font-size:12px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.compare-box{border:1px solid #e2e8f2;border-radius:10px;padding:17px}.compare-box h3{margin:0 0 14px;font-size:13px}.compare-box strong{font-size:20px}.compare-box p{font-size:12px;color:#66758b;line-height:1.6}.safe{border:1px solid #dce9e2;background:#f3faf6;border-radius:9px;padding:12px 14px;color:#326f52;font-size:12px;line-height:1.6}.dash-table td{vertical-align:top}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:950px){.shell{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:20px 9px}.brand{padding:0 6px 18px}.brand strong,.brand span,.nav .nav-label,.side-head,.side-bottom,.nav .count{display:none}.brand-mark{width:37px;height:37px}.nav button{justify-content:center;padding:13px 0}.workspace{padding:28px 23px}.topbar{padding:13px 15px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.shell{grid-template-columns:55px minmax(0,1fr)}.sidebar{padding:17px 5px}.brand-mark{width:32px;height:32px;font-size:11px}.brand{padding:0 5px 14px}.nav button{padding:13px 0}.workspace{padding:21px 15px}.topbar{gap:7px;padding:10px}.navback,.kbd{display:none}.search-box{padding:9px}.demo-pill{font-size:9px;padding:6px 7px}.stats,.quick-grid,.grid2,.compare-grid{grid-template-columns:1fr}.card-header{align-items:flex-start}.heading{font-size:29px}.modal-head,.modal-body{padding:17px}}

<body>
<div id="app"></div>
<script>
'use strict';
const docs=[
{id:'D001',name:'Revenue Testing FY 2025-26.pdf',folder:'Audit Evidence / Revenue',type:'PDF',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'2.4 MB',date:'18 Oct 2026',modified:18,preview:'A sample workpaper reviewing recognition of revenue, contract terms, and supporting invoices.'},
{id:'D002',name:'Trial Balance 31 March 2026.xlsx',folder:'Accounts / Trial Balance',type:'XLSX',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'348 KB',date:'14 Oct 2026',modified:14,preview:'Synthetic trial balance extract with account names and example balances.'},
{id:'D003',name:'Board Minutes Q2.pdf',folder:'Corporate Records / Meetings',type:'PDF',client:'BluePeak Technology',eng:'Internal Audit 2026',size:'1.2 MB',date:'12 Oct 2026',modified:12,preview:'Example board minutes concerning risk oversight and governance discussions.'},
{id:'D004',name:'Bank Confirmation - Sample.pdf',folder:'Confirmations / Banks',type:'PDF',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'561 KB',date:'10 Oct 2026',modified:10,preview:'Sample bank confirmation request and response. This is not real bank evidence.'},
{id:'D005',name:'Fixed Asset Register.xlsx',folder:'Accounts / Fixed Assets',type:'XLSX',client:'Cedar Retail Group',eng:'Due Diligence Q4',size:'922 KB',date:'9 Oct 2026',modified:9,preview:'Illustrative register of plant, equipment, acquisition dates and depreciation.'},
{id:'D006',name:'Internal Controls Walkthrough.docx',folder:'Internal Audit / Controls',type:'DOCX',client:'BluePeak Technology',eng:'Internal Audit 2026',size:'122 KB',date:'7 Oct 2026',modified:7,preview:'Example walkthrough narrative for order-to-cash and approval controls.'},
{id:'D007',name:'GST Reconciliation Working.xlsx',folder:'Indirect Tax / GST',type:'XLSX',client:'Cedar Retail Group',eng:'Due Diligence Q4',size:'735 KB',date:'6 Oct 2026',modified:6,preview:'Illustrative GST reconciliation schedule with intentionally synthetic figures.'},
{id:'D008',name:'Vendor Agreement - Sample.pdf',folder:'Contracts / Vendors',type:'PDF',client:'BluePeak Technology',eng:'Internal Audit 2026',size:'1.8 MB',date:'4 Oct 2026',modified:4,preview:'Sample contract clauses and vendor service-level terms.'},
{id:'D009',name:'Inventory Observation Notes.docx',folder:'Audit Evidence / Inventory',type:'DOCX',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'184 KB',date:'2 Oct 2026',modified:2,preview:'Illustrative inventory count attendance notes and sample exception observations.'},
{id:'D010',name:'Management Representation Letter.pdf',folder:'Closing / Representations',type:'PDF',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'410 KB',date:'1 Oct 2026',modified:1,preview:'Example management representation letter outline, not a signed or controlled document.'}
];
const clients=[{name:'Meridian Manufacturing',sector:'Manufacturing',count:6,status:'Active'},{name:'BluePeak Technology',sector:'Technology',count:3,status:'Active'},{name:'Cedar Retail Group',sector:'Retail',count:1,status:'Planning'}];
const state={page:'home',query:'',type:'All',client:null,engagement:null,doc:null,history:[],histIndex:-1,recent:[],pinned:new Set(),searches:[],modal:null,normalTab:'overview'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(page,{query=state.query,client=null,engagement=null,history=true}={}){if(history){state.history=state.history.slice(0,state.histIndex+1);state.history.push({page,query,client,engagement});state.histIndex=state.history.length-1;}state.page=page;state.query=query;state.client=client;state.engagement=engagement;state.type='All';state.modal=null;render();}
function back(){if(state.histIndex>0){state.histIndex--;const x=state.history[state.histIndex];Object.assign(state,x);state.type='All';state.modal=null;render();}}
function docRows(items){if(!items.length)return `<div class="empty">No sample documents match this view.<div style="margin-top:14px"><button class="action secondary small" data-page="home">Return home</button></div></div>`;return `<div class="table-wrap"><table><thead><tr><th>Document</th><th>Format</th><th>Client / Engagement</th><th>Size</th><th>Actions</th></tr></thead><tbody>${items.map(d=>`<tr><td><span class="filename">${esc(d.name)}</span><span class="path">${esc(d.folder)}</span></td><td><span class="doctype">${esc(d.type)}</span></td><td><div class="meta" style="color:#344257;font-weight:700">${esc(d.client)}</div><div class="meta" style="margin-top:4px">${esc(d.eng)}</div></td><td class="meta">${esc(d.size)}</td><td><div class="actions"><button class="action secondary small" data-open="${d.id}">Preview</button><button class="icon-btn ${state.pinned.has(d.id)?'pinned':''}" aria-label="${state.pinned.has(d.id)?'Unpin':'Pin'} ${esc(d.name)}" title="${state.pinned.has(d.id)?'Unpin':'Pin'}" data-pin="${d.id}">${state.pinned.has(d.id)?'★':'☆'}</button></div></td></tr>`).join('')}</tbody></table></div>`;}
function title(head,sub,eyebrow='DOCUMENT WORKSPACE'){return `<p class="eyebrow">${esc(eyebrow)}</p><h1 class="heading">${esc(head)}</h1><p class="lead">${esc(sub)}</p>`;}
function notice(){return `<div class="notice"><span>◈</span><div><strong>Interactive browser demo • synthetic data only.</strong> Search, pin, navigation and document previews work inside this page. No real files, accounts or native Tauri services are connected. Your actions reset when the page reloads.</div></div>`;}
function home(){return title('Find the right document. Faster.','A search-first workspace for professional engagements, audit evidence and workpapers. Explore with ten synthetic documents.')+notice()+`<div class="actions" style="margin-bottom:26px"><button class="action" data-search="Audit">Try searching documents →</button><button class="action secondary" data-page="clients">Explore clients</button></div><div class="stats"><div class="stat"><span class="statlabel">Indexed documents</span><strong>${docs.length}</strong><small>Demo documents</small></div><div class="stat"><span class="statlabel">Clients</span><strong>${clients.length}</strong><small>Sample organizations</small></div><div class="stat"><span class="statlabel">Recently opened</span><strong>${state.recent.length}</strong><small>This browser session</small></div><div class="stat"><span class="statlabel">Pinned</span><strong>${state.pinned.size}</strong><small>Quick access</small></div></div><div class="quick-grid"><button class="quick" data-page="recent"><span class="num">01 / OPEN</span><h3>Recent documents</h3><p>Recently previewed documents show here automatically.</p></button><button class="quick" data-page="pinned"><span class="num">02 / ORGANIZE</span><h3>Pinned documents</h3><p>Pin any result and return to it in one click.</p></button><button class="quick" data-page="searches"><span class="num">03 / DISCOVER</span><h3>Recent searches</h3><p>Repeat your earlier queries without retyping them.</p></button></div><div class="card" style="margin-top:26px"><div class="card-header"><h2>Suggested documents</h2><small>Recent sample items</small></div>${docRows(docs.slice(0,4))}</div>`;}
function filteredDocs(){const q=state.query.trim().toLowerCase();return docs.filter(d=>(state.type==='All'||d.type===state.type)&&(!state.client||d.client===state.client)&&(!state.engagement||d.eng===state.engagement)&&(!q||[d.name,d.folder,d.client,d.eng,d.type].some(x=>x.toLowerCase().includes(q))));}
function results(){const items=filteredDocs();return title(state.query?`Results for “${state.query}”`:'Document library',`Search filenames, folder paths, clients and engagement names. ${items.length} sample document${items.length===1?'':'s'} found.`,'SEARCH & RETRIEVAL')+notice()+`<div class="mini-filters">${['All','PDF','XLSX','DOCX'].map(t=>`<button class="filter ${state.type===t?'selected':''}" data-type="${t}">${t}</button>`).join('')}<span class="meta" style="margin-left:auto">${items.length} result${items.length===1?'':'s'}</span></div><section class="card"><div class="card-header"><h2>Matching documents</h2><small>Open a sample or pin for later</small></div>${docRows(items)}</section>`;}
function recent(){const list=state.recent.map(id=>docs.find(d=>d.id===id)).filter(Boolean);return title('Recent documents','Every sample preview you open appears here until you reload the page.','YOUR ACTIVITY')+notice()+`<div class="card"><div class="card-header"><h2>Recently opened</h2><small>${list.length} documents</small></div>${docRows(list)}</div>`;}
function pinned(){const list=docs.filter(d=>state.pinned.has(d.id));return title('Pinned documents','Quick access to the documents you want to keep close.','YOUR COLLECTION')+notice()+`<div class="card"><div class="card-header"><h2>Your pins</h2><small>${list.length} pinned</small></div>${docRows(list)}</div>`;}
function searches(){return title('Recent searches','Click any search to run it again against the sample index.','SEARCH HISTORY')+notice()+`<div class="card"><div class="card-header"><h2>Searches in this session</h2><small>${state.searches.length} unique queries</small></div>${state.searches.length?state.searches.map(q=>`<div class="searchhist"><div><strong>${esc(q)}</strong><p>Sample document-index lookup</p></div><button class="action secondary small" data-search="${esc(q)}">Search again →</button></div>`).join(''):`<div class="empty">Try a search in the top bar to populate this page.</div>`}</div>`;}
function clientsPage(){return title('Clients','Organize the document library around the organizations you serve.','ENGAGEMENT DIRECTORY')+notice()+`<div class="grid2">${clients.map(c=>`<button class="client-card" data-client="${esc(c.name)}"><h3>${esc(c.name)} →</h3><p>${esc(c.sector)} · ${esc(c.status)} client</p><div class="lower"><span>${docs.filter(d=>d.client===c.name).length} indexed documents</span><span>View workspace →</span></div></button>`).join('')}</div>`;}
function clientDetail(){const c=clients.find(x=>x.name===state.client);const items=docs.filter(d=>d.client===state.client);return title(c?.name||'Client',`${c?.sector||'Client'} workspace with linked sample documents and engagements.`,'CLIENT WORKSPACE')+notice()+`<div class="actions" style="margin-bottom:17px"><button class="action secondary" data-page="clients">← All clients</button><button class="action" data-page="engagements">Explore engagements</button></div><div class="card"><div class="card-header"><h2>Related documents</h2><small>${items.length} items</small></div>${docRows(items)}</div>`;}
function engagements(){const e=[...new Set(docs.map(x=>x.eng))];return title('Engagements','Choose a professional engagement and explore its example document records.','WORKSPACE DIRECTORY')+notice()+`<div class="grid2">${e.map(n=>`<button class="client-card" data-engagement="${esc(n)}"><span class="pill">Example engagement</span><h3 style="margin-top:15px">${esc(n)} →</h3><p>${docs.filter(d=>d.eng===n).length} example documents linked</p><div class="lower"><span>Open workspace</span><span>→</span></div></button>`).join('')}</div>`;}
function engagementDetail(){let items=docs.filter(d=>d.eng===state.engagement);return title(state.engagement||'Engagement','Linked example evidence and account schedules.','ENGAGEMENT WORKSPACE')+notice()+`<div class="actions" style="margin-bottom:17px"><button class="action secondary" data-page="engagements">← All engagements</button></div><div class="card"><div class="card-header"><h2>Documents</h2><small>${items.length} items</small></div>${docRows(items)}</div><div class="safe">Workpaper sign-offs, evidence capture, native indexing and controlled versions are intentionally not simulated as real actions.</div>`;}
function normalData(){return title('Normal Data','A small interactive example of field comparison. This is not a ledger import, certification or an accounting reconciliation.','NORMAL DATA WORKSPACE')+notice()+`<div class="card"><div class="card-header"><h2>Example comparison</h2><small>Illustrative, local, read-only</small></div><div style="padding:21px"><div class="compare-grid"><div class="compare-box"><h3>Left dataset · Example invoice</h3><span class="meta">Voucher ID</span><div><strong>INV-100</strong></div><p>Amount: ₹12,500.00<br>Customer: Example Corporation</p></div><div class="compare-box"><h3>Right dataset · Example entry</h3><span class="meta">Reference ID</span><div><strong>INV-100</strong></div><p>Amount: ₹12,200.00<br>Customer: Example Corporation</p></div></div><div class="actions" style="margin:20px 0"><button class="action" id="compare-example">Compare sample values</button><button class="action secondary" id="clear-example">Clear</button></div><div id="comparison-result" class="muted" style="font-size:12px">No comparison has been requested.</div></div></div><div class="safe">A difference is an advisory observation, not an error in the original document. This demo never alters source files or books.</div>`;}
function preview(id){let d=docs.find(x=>x.id===id);if(!d)return;state.modal=id;if(!state.recent.includes(id))state.recent.unshift(id);state.recent=state.recent.slice(0,10);render();}
function modalHtml(){if(!state.modal)return '';let d=docs.find(x=>x.id===state.modal);if(!d)return '';return `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><p class="eyebrow" style="margin-bottom:9px">SAMPLE DOCUMENT PREVIEW</p><h2 id="modal-title">${esc(d.name)}</h2><span class="path" style="max-width:680px;white-space:normal">${esc(d.folder)} · ${esc(d.client)}</span></div><button class="close" id="close-modal" aria-label="Close preview">×</button></header><div class="modal-body"><div class="notice" style="margin-bottom:20px">This is a simulated text preview of a synthetic document. The actual PDF, Word, Excel and file-opening capabilities require the desktop backend.</div><div class="preview"><div class="preview-paper"><span class="eyebrow">PROFESSIONAL DOCX · SAMPLE</span><h3>${esc(d.name)}</h3><p>${esc(d.preview)}</p><div class="fake-line" style="width:92%"></div><div class="fake-line" style="width:78%"></div><div class="fake-line" style="width:88%"></div><div class="fake-line" style="width:61%"></div><p class="dim" style="margin-top:34px">Illustrative content — not original evidence or a legally valid professional record.</p></div></div><div class="actions" style="margin-top:20px"><button class="action secondary" data-pin="${d.id}">${state.pinned.has(d.id)?'★ Unpin document':'☆ Pin document'}</button><button class="action secondary" id="version-example">Version history</button><button class="action" id="done-preview">Return to workspace</button></div></div></div></div>`;}
function content(){if(state.page==='home'&&!state.query)return home();if(state.page==='search'||state.query)return results();if(state.page==='recent')return recent();if(state.page==='pinned')return pinned();if(state.page==='searches')return searches();if(state.page==='clients')return state.client?clientDetail():clientsPage();if(state.page==='engagements')return state.engagement?engagementDetail():engagements();if(state.page==='normal-data')return normalData();return home();}
const menu=[['home','⌂','Home'],['clients','◈','Clients'],['engagements','▧','Engagements'],['normal-data','≡','Normal Data'],['recent','◷','Recent'],['searches','⌕','Searches'],['pinned','☆','Pinned']];
function render(){document.title='Professional DocX — Browser Test Drive';document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar" aria-label="Primary navigation"><div class="brand"><div class="brand-mark">PD</div><div><strong>Professional DocX</strong><span>Search-first workspace</span></div></div><p class="side-head">Workspace</p><nav class="nav">${menu.map(([id,ic,label])=>`<button title="${label}" data-page="${id}" class="${state.page===id?'active':''}"><span class="nav-icon">${ic}</span><span class="nav-label">${label}</span>${id==='recent'&&state.recent.length?`<span class="count">${state.recent.length}</span>`:''}${id==='pinned'&&state.pinned.size?`<span class="count">${state.pinned.size}</span>`:''}</button>`).join('')}</nav><div class="side-bottom"><b>Browser test drive</b><br>Sample data · Local interactions<br>No account needed</div></aside><main class="main"><header class="topbar"><button class="navback" title="Back" id="back" ${state.histIndex<=0?'disabled':''}>←</button><label class="search-box"><span aria-hidden="true">⌕</span><span class="sr-only">Search indexed documents</span><input id="global-search" type="search" placeholder="Find any document, client or folder..." value="${esc(state.query)}" autocomplete="off"><kbd class="kbd">Ctrl K</kbd></label><span class="demo-pill">● DEMO MODE</span></header><div class="workspace">${content()}<div class="footer">Professional DocX · Browser preview · Sample data only. No connection to your files, native index, audit trail or accounting records. This is an interactive demonstration of the search-first workflow, not the production Tauri application.</div></div></main></div>${modalHtml()}`;attach();}
function query(q){q=q.trim();if(q&&!state.searches.includes(q))state.searches.unshift(q);nav('search',{query:q});}
function attach(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.page,{query:'',client:null,engagement:null})));document.querySelectorAll('[data-search]').forEach(el=>el.addEventListener('click',()=>query(el.dataset.search)));document.querySelectorAll('[data-client]').forEach(el=>el.addEventListener('click',()=>nav('clients',{query:'',client:el.dataset.client})));document.querySelectorAll('[data-engagement]').forEach(el=>el.addEventListener('click',()=>nav('engagements',{query:'',engagement:el.dataset.engagement})));document.querySelectorAll('[data-pin]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.pin;state.pinned.has(id)?state.pinned.delete(id):state.pinned.add(id);render();}));document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>preview(el.dataset.open)));document.querySelectorAll('[data-type]').forEach(el=>el.addEventListener('click',()=>{state.type=el.dataset.type;render()}));let input=$('#global-search');input.addEventListener('input',()=>{state.query=input.value;state.page='search';let pos=input.selectionStart;render();let newI=$('#global-search');newI.focus();newI.setSelectionRange(pos,pos);});input.addEventListener('keydown',e=>{if(e.key==='Enter'){query(e.target.value);e.target.blur()}});let b=$('#back');if(b)b.addEventListener('click',back);let c=$('#close-modal');if(c)c.addEventListener('click',()=>{state.modal=null;render()});let done=$('#done-preview');if(done)done.addEventListener('click',()=>{state.modal=null;render()});let backdrop=$('#modal-backdrop');if(backdrop)backdrop.addEventListener('click',e=>{if(e.target===backdrop){state.modal=null;render()}});let v=$('#version-example');if(v)v.addEventListener('click',()=>alert('Browser demo: no verified source/version history is available. Real history requires the native document service.'));let n=$('#compare-example');if(n)n.addEventListener('click',()=>{$('#comparison-result').innerHTML='<div class="notice" style="margin:0"><strong>Advisory difference:</strong>&nbsp; ₹12,500.00 versus ₹12,200.00 (₹300.00). No file or book change is required.</div>';});let clear=$('#clear-example');if(clear)clear.addEventListener('click',()=>{$('#comparison-result').textContent='No comparison has been requested.'});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.modal=null;render();$('#global-search').focus();}});
state.history.push({page:'home',query:'',client:null,engagement:null});state.histIndex=0;render();
</script>
</body></html>
