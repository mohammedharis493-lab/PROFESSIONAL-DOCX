<title>Professional DocX · Design Preview</title>
<style>

.home-layout{display:grid;grid-template-columns:minmax(0,1fr) 269px;gap:43px;align-items:start}

.shortcut:last-child{border-bottom:0}

.avatar.alt{background:#f4f1eb;color:#8e7559}
.dir-title{display:block;color:#2a4556;font-size:13.2px;font-weight:710}
.dir-meta{display:block;color:#91a0aa;font-size:11.5px;margin-top:5px}
.directory-arrow{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:11.7px;color:#8395a0}
.directory-arrow svg{height:16px;width:16px}
.empty{padding:70px 25px;text-align:center;color:#8798a3}
.empty svg{width:27px;height:27px;color:#9aabb5;margin-bottom:11px}
.empty h3{color:#3f5767;font-size:14px;margin:7px 0}

.search-chip{color:#507082;background:#eef4f6;border-radius:5px;font-size:11px;padding:5px 8px}
.mini-ribbon{display:flex;align-items:center;gap:9px;color:#8798a3;font-size:12px;margin-bottom:18px}

.compare-card .overline{margin-bottom:18px}
.compare-card h3{font-size:17px;margin:0 0 12px;color:#2d4554}
.compare-value{font-size:27px;font-weight:735;letter-spacing:-.035em;margin:8px 0 17px;color:#213d4f}
.compare-meta{border-top:1px solid #edf0f1;padding:14px 0 0;color:#81929c;font-size:12px}
.compare-result{margin-top:17px;background:#f4f7f8;border:1px solid #dce8ec;border-radius:10px;padding:17px;color:#36566b;font-size:12.8px;line-height:1.6}
.compare-result strong{display:block;margin-bottom:6px;color:#29495a}
.inline-note{margin-top:18px;color:#94a2ac;font-size:11.5px;line-height:1.6}
.overlay{position:fixed;inset:0;background:#14232db8;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:24px}
.dialog{width:min(1150px,100%);max-height:92dvh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 25px 80px #101a2380;overflow:hidden}
.dialog-header{padding:20px 25px;display:flex;gap:13px;align-items:center;border-bottom:1px solid var(--line)}

.icon-button{width:37px;height:37px;border:1px solid #e5ecef;border-radius:8px;background:#fff;display:grid;place-items:center;color:#587080;flex:none}
.icon-button:hover{background:#f5f8f9}
.icon-button svg{width:17px;height:17px}
.dialog-layout{min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 268px}

 .shell{display:block}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;height:100dvh;transform:translateX(-110%);transition:transform .2s ease;padding:27px 17px;box-shadow:14px 0 40px #24384610}

<script>
'use strict';
/* The only documents this prototype knows are fictional samples embedded below. */

function paper(d){const basename=d.name.replace(/\.(pdf|xlsx|docx)$/i,'');const intro=esc(d.preview);if(d.type==='XLSX')return `<article class="paper" aria-label="Illustrative spreadsheet preview"><div class="paper-kicker">EXAMPLE SPREADSHEET · FICTIONAL DATA</div><h2>${esc(basename)}</h2><p class="paper-intro">${intro}</p><div class="paper-rule"></div><div class="paper-label">SAMPLE WORKSHEET · DISPLAY ONLY</div><table class="sheet-preview"><thead><tr><th>REF</th><th>DESCRIPTION</th><th>DEBIT ₹</th><th>CREDIT ₹</th></tr></thead><tbody><tr><td>101</td><td>Opening balances</td><td>12,500</td><td>—</td></tr><tr><td>102</td><td>Example adjustment</td><td>—</td><td>2,200</td></tr><tr><td>103</td><td>Illustrative amount</td><td>8,250</td><td>—</td></tr><tr><td>104</td><td>Closing example</td><td>—</td><td>18,550</td></tr></tbody></table><div class="paper-callout">Fictional figures for visual evaluation only. Not a verified or imported ledger.</div></article>`;return `<article class="paper" aria-label="Illustrative document preview"><div class="paper-kicker">PROFESSIONAL DOCX · FICTIONAL SAMPLE</div><h2>${esc(basename)}</h2><p class="paper-intro">${intro}</p><div class="paper-rule"></div><div class="paper-grid"><div><div class="paper-label">CLIENT</div><strong>${esc(d.client)}</strong></div><div><div class="paper-label">ENGAGEMENT</div><strong>${esc(d.eng)}</strong></div><div><div class="paper-label">DOCUMENT TYPE</div><strong>${esc(d.type)} example</strong></div><div><div class="paper-label">REFERENCE</div><strong>${esc(d.id)} / Preview</strong></div></div><div class="paper-rule"></div><div class="paper-label">DOCUMENT OVERVIEW</div><p class="paper-paragraph">This page illustrates the typography, reading width, and structure of a professional document inside the application. The content is a demonstration and is not sourced from actual client documentation.</p><p class="paper-paragraph">Use the panel alongside to review contextual details. In the full desktop application, opening and verifying source documents requires the separately authorized native document service.</p><div class="paper-callout">Visual sample only · No substantive accounting conclusion, professional sign-off, or source-byte verification.</div></article>`;}
function modal(){if(!state.modal)return '';let d=docs.find(x=>x.id===state.modal);if(!d)return '';let ix=docs.findIndex(x=>x.id===d.id);return `<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title"><header class="dialog-header">${fileLabel(d)}<div style="min-width:0"><div id="preview-title" class="dialog-title">${esc(d.name)}</div><div class="dialog-sub">${esc(d.folder)} · Fictional sample</div></div><div class="dialog-actions"><button type="button" class="icon-button" id="close-preview" aria-label="Close document preview" title="Close (Esc)">${icon('close')}</button></div></header><div class="dialog-layout"><div class="document-stage"><div class="stage-label"><span>DOCUMENT PREVIEW</span><span>ILLUSTRATIVE CONTENT</span></div>${paper(d)}</div><aside class="inspector" aria-label="Document information"><h3>File information</h3>${[['Client',d.client],['Engagement',d.eng],['File type',d.type],['Size',d.size],['Updated',d.date],['Location',d.folder]].map(([a,b])=>`<div class="detail"><span class="detail-label">${esc(a)}</span><span class="detail-value">${esc(b)}</span></div>`).join('')}<div class="inspector-foot">This is a simulated preview. The production application’s document opening, versions, and permissions require its Tauri backend.</div></aside></div><footer class="dialog-footer"><div class="preview-controls"><button class="icon-button" id="prev-doc" aria-label="Previous sample document" ${ix===0?'disabled':''}>${icon('chevronLeft')}</button><span class="preview-number">${ix+1} / ${docs.length}</span><button class="icon-button" id="next-doc" aria-label="Next sample document" ${ix===docs.length-1?'disabled':''}>${icon('chevron')}</button></div><div style="display:flex;gap:8px;align-items:center"><button class="action secondary small" data-pin="${d.id}">${state.pinned.has(d.id)?'Unpin document':'Pin document'}</button><button class="action small" id="done-preview">Done</button></div></footer></section></div>`;}
function render({focusSearch=false}={}){
 document.title='Professional DocX · Design Preview';
 $('#app').innerHTML=`<div class="shell"><aside class="sidebar" aria-label="Primary navigation"><div class="brand"><div class="brand-logo">PD</div><div><div class="brand-name">Professional DocX</div><div class="brand-sub">Document workspace</div></div></div><p class="side-caption">Library</p><nav class="side-group" aria-label="Library">${sidebarLinks(MENU)}</nav><p class="side-caption">Workspaces</p><nav class="side-group" aria-label="Workspaces">${sidebarLinks(WORK)}</nav><p class="side-caption">Activity</p><nav class="side-group" aria-label="Activity">${sidebarLinks(ACTIVITY)}</nav><div class="side-bottom"><div class="environment">Preview environment</div><p>Fictional records · Private local session</p></div></aside><main class="main"><header class="topbar"><button type="button" class="mobile-menu" id="menu-button" aria-label="Open navigation" aria-expanded="${state.drawer}">${icon('menu')}</button><div class="trail"><span class="trail-base">Workspace</span><span class="slash">/</span><strong>${esc(crumb())}</strong></div><span class="top-spacer"></span><label class="search">${icon('search')}<span class="sr-only">Search documents</span><input id="global-search" type="search" placeholder="Search files, clients, folders…" value="${esc(state.query)}" autocomplete="off" aria-label="Search sample documents"/><kbd>⌘ K</kbd></label><div class="session"><span class="sample-tag">SAMPLE DATA</span></div></header><div class="workspace" id="page-content">${display()}${foot()}</div></main></div>${modal()}`;
 document.body.classList.toggle('menu-open',state.drawer);
 $('#drawer-scrim').hidden=!state.drawer;
 connect();
 if(focusSearch){const input=$('#global-search');input?.focus();input?.setSelectionRange(input.value.length,input.value.length);}
}
function navigate(page,extra={}){state.page=page;state.query=extra.query??'';state.client=extra.client??null;state.engagement=extra.engagement??null;state.type='All';state.modal=null;state.drawer=false;state.history=state.history.slice(0,state.histIndex+1);state.history.push({page,query:state.query,client:state.client,engagement:state.engagement});state.histIndex=state.history.length-1;render();window.scrollTo(0,0);}
function doSearch(queryText){let value=String(queryText).trim();if(value&&!state.searches.includes(value))state.searches.unshift(value);navigate('search',{query:value});}
function closePreview(){state.modal=null;render();const d=state.returnFocusId||state.lastPreview;state.returnFocusId=null;const previous=document.querySelector(`[data-open="${d}"]`);if(previous)previous.focus();else $('#global-search')?.focus();}
function openPreview(id){if(!docs.some(d=>d.id===id))return;if(!state.modal)state.returnFocusId=id;state.modal=id;state.lastPreview=id;state.drawer=false;state.recent=state.recent.filter(x=>x!==id);state.recent.unshift(id);state.recent=state.recent.slice(0,10);render();$('#close-preview')?.focus();}
function stepPreview(delta){if(!state.modal)return;let index=docs.findIndex(x=>x.id===state.modal);let next=docs[index+delta];if(next)openPreview(next.id);}
function togglePin(id){if(state.pinned.has(id))state.pinned.delete(id);else state.pinned.add(id);render();}
function connect(){
 document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
 document.querySelectorAll('[data-client]').forEach(b=>b.addEventListener('click',()=>navigate('clients',{client:b.dataset.client})));
 document.querySelectorAll('[data-engagement]').forEach(b=>b.addEventListener('click',()=>navigate('engagements',{engagement:b.dataset.engagement})));
 document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPreview(b.dataset.open)));
 document.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',()=>togglePin(b.dataset.pin)));
 document.querySelectorAll('[data-search]').forEach(b=>b.addEventListener('click',()=>doSearch(b.dataset.search)));
 document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{state.type=b.dataset.type;render();}));
 const f=$('#client-filter');if(f)f.addEventListener('change',()=>{state.client=f.value||null;render();});
 const s=$('#sort-filter');if(s)s.addEventListener('change',()=>{state.sort=s.value;render();});
 const input=$('#global-search');if(input){input.addEventListener('input',()=>{const v=input.value;state.query=v;state.page='search';state.client=null;state.engagement=null;render({focusSearch:true});});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch(e.target.value);}});}
 const menu=$('#menu-button');if(menu)menu.addEventListener('click',()=>{state.drawer=!state.drawer;document.body.classList.toggle('menu-open',state.drawer);$('#drawer-scrim').hidden=!state.drawer;menu.setAttribute('aria-expanded',state.drawer);});
 const close=$('#close-preview');if(close)close.addEventListener('click',closePreview);
 const done=$('#done-preview');if(done)done.addEventListener('click',closePreview);
 const ov=$('#overlay');if(ov)ov.addEventListener('click',e=>{if(e.target===ov)closePreview();});
 const prev=$('#prev-doc');if(prev)prev.addEventListener('click',()=>stepPreview(-1));
 const next=$('#next-doc');if(next)next.addEventListener('click',()=>stepPreview(1));
 const run=$('#run-compare');if(run)run.addEventListener('click',()=>{$('#compare-result').className='compare-result';$('#compare-result').innerHTML='<strong>Difference to review · ₹300.00</strong>Document amount: ₹12,500.00<br>Example reference: ₹12,200.00<br>Illustrative only. No data is corrected, signed or saved.';});
 const clear=$('#clear-compare');if(clear)clear.addEventListener('click',()=>{$('#compare-result').className='inline-note';$('#compare-result').textContent='No comparison requested.';});
}
$('#drawer-scrim').addEventListener('click',()=>{state.drawer=false;document.body.classList.remove('menu-open');$('#drawer-scrim').hidden=true;});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(state.modal){e.preventDefault();closePreview();}else if(state.drawer){state.drawer=false;document.body.classList.remove('menu-open');$('#drawer-scrim').hidden=true;}return;}
 if(state.modal){
  if(e.key==='Tab'){
   const dialog=$('.dialog');
   const focusable=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href]')];
   const first=focusable[0],last=focusable[focusable.length-1];
   if(focusable.length&&(!dialog.contains(document.activeElement)||e.shiftKey&&document.activeElement===first)){e.preventDefault();(e.shiftKey?last:first).focus();}
   else if(focusable.length&&!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
   return;
  }
  if(e.key==='ArrowRight'){e.preventDefault();stepPreview(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();stepPreview(-1);}
  return;
 }
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search')?.focus();$('#global-search')?.select();}
 if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();$('#global-search')?.focus();}
});
state.history.push({page:'home',query:'',client:null,engagement:null});state.histIndex=0;render();
</script>
</body>
</html>
