/* Professional DocX — quiet enterprise workspace, inspired by modern document tools. */
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243047;background:#fcfcfd;font-synthesis:none;--ink:#17263a;--muted:#727e90;--line:#e9ecf0;--accent:#254968;--accent-hover:#1b3853;--sidebar:#f7f8fa;--subtle:#f8f9fb;--radius:11px}
body{background:#fff;color:var(--ink)}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #8eadd1;outline-offset:2px}
.shell{grid-template-columns:232px minmax(0,1fr);background:#fff}
.sidebar{background:var(--sidebar);border-right:1px solid #e6e8ec;color:var(--ink);padding:30px 15px 18px;z-index:12}
.brand{padding:0 10px 28px;margin-bottom:7px;border-bottom:0;gap:11px}
.brand-mark{width:35px;height:35px;background:#263d55;border-radius:9px;color:#fff;letter-spacing:-.085em;font-size:15px;font-weight:780}
.brand strong{font-size:13.5px;font-weight:740;letter-spacing:-.022em;color:#1c2a3c;line-height:1.2}
.brand span{font-size:10px;letter-spacing:.035em;color:#8c97a6;margin-top:4px}
.side-head{color:#8b95a3;font-size:10px;letter-spacing:.095em;font-weight:750;margin:18px 12px 9px}
.nav{gap:2px;margin-bottom:13px}
.nav button{min-height:39px;color:#56657a;border-radius:8px;padding:9px 11px;gap:12px;font-size:12.8px;font-weight:540;transition:background .13s,color .13s}
.nav button:hover{background:#eff1f5;color:#21384f}
.nav button.active{background:#e9edf2;color:#1b3753;font-weight:690;box-shadow:inset 2px 0 0 #284e72}
.nav-icon{width:17px;height:18px;font-size:17px;display:inline-flex;justify-content:center;align-items:center;color:#8490a0}
.nav-icon svg{display:block;stroke-width:1.75}
.nav button.active .nav-icon{color:#294e72}
.nav .count{font-size:10px;color:#6e7989;background:#e7eaf0;border-radius:6px;min-width:23px;text-align:center;padding:3px 6px}
.side-bottom{border-top:1px solid #e6e9ed;color:#8c97a6;font-size:10.5px;line-height:1.6;margin-top:auto;padding:17px 12px 1px}
.side-bottom b{color:#4c5a6b;font-weight:650}
.sidebar-tiny{display:block;font-size:10px;color:#94a0af;margin-top:3px}
.main{min-width:0;background:#fff}
.topbar{padding:0 42px;height:71px;background:#fff;border-bottom:1px solid var(--line);gap:20px;position:sticky}
.navback{width:32px;height:32px;border:0;background:transparent;color:#748195;font-size:17px;border-radius:7px}
.navback:hover:not(:disabled){background:#f2f4f7}
.navback:disabled{opacity:.27;cursor:default}
.breadcrumbs{white-space:nowrap;display:flex;align-items:center;gap:10px;color:#8b96a5;font-size:12px;font-weight:550;flex:none}
.breadcrumbs .crumb-current{color:#37475b;font-weight:670}
.crumb-divider{color:#bec5ce}
.top-spacer{flex:1}
.search-box{flex:0 1 420px;min-width:160px;background:#fafbfc;border:1px solid #e5e9ed;border-radius:9px;padding:9px 13px;gap:10px;min-height:38px;transition:box-shadow .12s,border-color .12s}
.search-box:focus-within{border-color:#aebed0;box-shadow:0 0 0 3px #c5d4e824}
.search-box input{font-size:12.7px;color:#314156}
.search-box input::placeholder{color:#99a3b0}
.search-svg{color:#8c98a7;display:flex;align-items:center}
.kbd{font-size:10px;color:#98a2ae;border-color:#e6e9ed;background:#fff;padding:3px 5px}
.demo-pill{border-color:#e4e8ec;background:#f8f9fa;color:#748090;font-size:10px;letter-spacing:.035em;font-weight:720;padding:6px 9px;border-radius:6px}
.workspace{max-width:1200px;padding:41px 46px 72px}
.eyebrow{font-size:10px;letter-spacing:.12em;color:#8a97a8;font-weight:740;margin-bottom:12px}
.heading{font-size:clamp(26px,2.35vw,34px);letter-spacing:-.044em;font-weight:740;line-height:1.19;color:#1b2b40;margin:0 0 9px}
.lead{font-size:13.5px;color:#7d8999;line-height:1.66;margin:0 0 28px;max-width:690px}
.notice{margin:0 0 16px;background:#f8fafc;border-color:#ebeff4;color:#778496;padding:10px 14px;border-radius:7px}
.notice strong{color:#677487}
.action{font-weight:650;font-size:12px;border-radius:8px;background:#294967;border-color:#294967;padding:10px 15px;min-height:36px;transition:background .13s,border-color .13s}
.action:hover{background:#203b54;border-color:#203b54}
.action.secondary{border-color:#e3e7ed;background:#fff;color:#445870}
.action.secondary:hover{background:#f8f9fb}
.action.ghost{color:#516780}
.action.small{padding:6px 11px;font-size:11.5px;min-height:31px}
.actions{gap:7px}
.card{border:1px solid #e9ecf0;box-shadow:0 2px 7px #14253a05;border-radius:10px;margin:0 0 22px}
.card-header{padding:17px 19px;border-bottom:1px solid #eef0f3}
.card-header h2{font-size:13px;font-weight:710;color:#27384d;letter-spacing:-.015em}
.card-header small{font-size:11px;color:#8d99a7}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 13px}
.section-header h2{margin:0;font-size:15px;letter-spacing:-.02em;font-weight:700;color:#27384e}
.section-header button{border:0;background:transparent;color:#667c91;font-size:12px;font-weight:600;padding:6px;cursor:pointer}
.section-header button:hover{color:#214d79;text-decoration:underline}
.doc-table{overflow:auto}
table{border-collapse:collapse;width:100%}
th{background:#fcfcfd;color:#97a0ad;font-size:10px;letter-spacing:.075em;font-weight:700;text-transform:uppercase}
th,td{padding:13px 17px;border-bottom:1px solid #f0f1f3;text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfcfd}
.file-cell{display:flex;align-items:center;gap:13px;min-width:240px}
.file-glyph{display:flex;flex:none;align-items:center;justify-content:center;width:35px;height:39px;border-radius:7px;font-size:9px;font-weight:850;letter-spacing:-.02em;border:1px solid currentColor}
.file-glyph.pdf{background:#fff3f2;color:#c06658;border-color:#f3dcd7}
.file-glyph.xlsx{background:#edf8f1;color:#338058;border-color:#d3e9db}
.file-glyph.docx{background:#eef4fc;color:#426b9a;border-color:#d7e3f3}
.filename{font-size:12.5px;color:#2a3a4e;font-weight:660;letter-spacing:-.006em;line-height:1.4}
.filename-link{border:0;padding:0;background:transparent;text-align:left;cursor:pointer}
.filename-link:hover{color:#265d8f;text-decoration:underline;text-underline-offset:2px}
.path{font-size:11px;color:#929eac;margin-top:4px;max-width:390px}
.meta{color:#798596;font-size:11.5px}
.meta.strong{color:#4f6074;font-weight:600}
.client-meta{max-width:185px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doctype{background:#f4f6f8;color:#718296;border-radius:5px;padding:4px 7px;font-size:10px}
.row-actions{display:flex;justify-content:flex-end;gap:7px;align-items:center}
.icon-btn{border-color:transparent;border-radius:7px;padding:5px;color:#a3acb8;font-size:19px;line-height:1.1;min-width:30px;min-height:30px}
.icon-btn:hover{border-color:#e9edf2;background:#f8fafc;color:#607287}
.icon-btn.pinned{background:#fff8e9;border-color:#f5e5c8;color:#bb8a37}
.empty{padding:52px 22px;color:#8490a0;font-size:12.5px}
.mini-filters{margin:4px 0 18px;gap:6px}
.filter{padding:7px 13px;background:#fff;border-color:#e7eaf0;border-radius:7px;color:#738093;font-weight:570;font-size:11.5px}
.filter.selected{background:#e9eff5;border-color:#dae3ed;color:#274664;font-weight:700}
.filter:hover:not(.selected){background:#f7f9fa}
.home-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:0 0 33px}
.home-heading .lead{margin-bottom:0}
.home-heading .actions{padding-top:17px}
.overview-line{display:flex;align-items:center;gap:33px;flex-wrap:wrap;border-top:1px solid #e9edf1;border-bottom:1px solid #e9edf1;padding:19px 0;margin-bottom:7px}
.overview-metric{display:flex;align-items:center;gap:10px}
.overview-metric strong{font-size:19px;letter-spacing:-.035em;color:#2c4159;font-weight:740}
.overview-metric span{font-size:11.6px;color:#8a97a6}
.overview-metric+.overview-metric{border-left:1px solid #e6eaf0;padding-left:29px}
.secondary-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.secondary-link{border:1px solid #e9edf1;background:#fff;padding:16px 15px;border-radius:10px;text-align:left;min-height:92px;display:flex;align-items:flex-start;gap:12px;transition:background .15s,border-color .15s}
.secondary-link:hover{background:#fbfcfd;border-color:#ccd8e3}
.secondary-link .secondary-symbol{display:grid;place-items:center;width:31px;height:31px;border:1px solid #edf0f4;border-radius:8px;color:#6e8299;background:#fafbfc;flex:none}
.secondary-link strong{display:block;font-size:12.6px;color:#354960;margin:1px 0 6px;font-weight:710}
.secondary-link small{display:block;font-size:11px;color:#929ead;line-height:1.5}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.client-card{padding:20px 21px;box-shadow:none;border:1px solid #e9ecf0;border-radius:10px;min-height:120px;text-align:left;transition:border-color .15s,background .15s}
.client-card:hover{background:#fbfcfd;border-color:#cbd6e2}
.client-card h3{font-size:14px;color:#2b3e53;letter-spacing:-.012em;font-weight:680}
.client-card p{color:#8b98a7;font-size:11.5px}
.client-card .lower{border-color:#eef0f3;font-size:11px;color:#738397;margin-top:19px}
.tag{border-radius:5px;font-weight:650}
.searchhist{padding:16px 20px}
.searchhist strong{font-size:12.5px}
.searchhist p{font-size:11.5px}
.compare-grid{gap:13px}
.compare-box{border-color:#e7ebef;background:#fff;border-radius:9px;padding:22px}
.compare-box h3{font-size:12px;color:#697c90;font-weight:680}
.compare-box strong{font-size:23px;font-weight:720;color:#2e435a}
.compare-box p{font-size:12px;line-height:1.8}
.safe{background:#f7faf8;border-color:#e3ece6;color:#617b6a;font-size:11.5px;border-radius:8px;padding:13px 16px}
.modal-backdrop{background:#12203170;backdrop-filter:blur(3px);padding:23px}
.modal{width:min(1060px,100%);border-radius:13px;max-height:93vh;box-shadow:0 25px 90px #111e3240}
.modal-head{padding:23px 28px;align-items:center}
.modal-head h2{font-size:18px;color:#24364c;font-weight:720;max-width:730px}
.modal-head .path{font-size:11.5px;max-width:740px}
.modal-body{padding:25px 28px 26px}
.close{width:32px;height:32px;border-radius:7px;background:#f3f5f7;color:#586d84}
.close:hover{background:#e9edf3}
.preview-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:25px;align-items:stretch}
.preview{background:#f6f7f9;border:1px solid #ecedf1;border-radius:9px;padding:25px;max-width:none}
.preview-paper{padding:36px 42px;min-height:340px;max-width:610px;margin:auto;border:1px solid #e9ebee;box-shadow:0 3px 9px #1824370b;border-radius:2px}
.preview-paper h3{font-size:21px;color:#25344a;margin:0 0 21px}
.preview-paper p{line-height:1.85;font-size:12px;color:#56667a}
.preview-paper .fake-line{height:7px;background:#f1f3f6;border-radius:3px;margin:15px 0}
.preview-details{display:flex;flex-direction:column;gap:18px}
.preview-details h3{font-size:12.5px;color:#40526a;margin:1px 0 1px;font-weight:720}
.meta-pair{display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.meta-pair span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#a0aab5}
.meta-pair strong{font-size:11.7px;line-height:1.5;font-weight:630;color:#4b5d73;word-break:break-word}
.preview-aside-notice{border-top:1px solid #e8ebef;padding-top:14px;color:#9aa5b2;font-size:10.7px;line-height:1.65;margin-top:auto}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px}
.footer{border-color:#eef0f3;color:#a5aeba;font-size:10.5px;margin-top:47px;padding-top:17px;line-height:1.6}
@media(max-width:1120px){.topbar{padding:0 25px}.workspace{padding:36px 28px 60px}.search-box{flex-basis:310px}.hide-compact{display:none}}
@media(max-width:860px){.shell{grid-template-columns:69px minmax(0,1fr)}.sidebar{padding:23px 9px}.brand{justify-content:center;padding:0 0 24px}.brand strong,.brand span,.nav .nav-label,.side-head,.side-bottom,.nav .count{display:none}.nav button{justify-content:center;min-height:44px;padding:10px 0}.nav-icon{width:19px;height:19px}.topbar{padding:0 22px}.breadcrumbs{display:none}.search-box{flex:1}.workspace{padding:31px 25px}.secondary-links{grid-template-columns:1fr 1fr}.hide-tablet{display:none}}
@media(max-width:590px){.shell{grid-template-columns:56px minmax(0,1fr)}.sidebar{padding:16px 6px}.brand-mark{width:32px;height:32px;font-size:13px}.topbar{gap:7px;padding:0 13px;height:61px}.navback{flex:none}.search-box{min-width:0;padding:9px}.search-box input{font-size:11px}.kbd,.demo-pill{display:none}.workspace{padding:25px 17px 48px}.heading{font-size:27px}.home-heading{display:block}.home-heading .actions{padding-top:22px}.overview-line{gap:12px;padding:15px 0;justify-content:space-between}.overview-metric{display:block}.overview-metric+.overview-metric{padding-left:12px}.overview-metric strong{display:block;font-size:19px}.overview-metric span{display:block;font-size:10px}.section-header{margin-top:25px}.secondary-links,.grid2,.compare-grid,.preview-layout{grid-template-columns:1fr}.secondary-link{min-height:auto}.table-wrap{margin:0}.doc-table th:not(:first-child),.doc-table td:not(:first-child){display:none}.doc-table th,.doc-table td{padding:13px 14px}.file-cell{min-width:0}.filename{max-width:230px;display:block}.modal{max-height:95vh}.modal-head{padding:18px}.modal-body{padding:18px}.preview{padding:14px}.preview-paper{padding:20px;min-height:250px}.preview-details{gap:10px}.modal-foot{flex-direction:column;align-items:stretch}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const docs=[
{id:'D001',name:'Revenue Testing FY 2025-26.pdf',folder:'Audit Evidence / Revenue',type:'PDF',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'2.4 MB',date:'18 Oct 2026',modified:18,preview:'A sample workpaper reviewing recognition of revenue, contract terms, and supporting invoices.'},
{id:'D002',name:'Trial Balance 31 March 2026.xlsx',folder:'Accounts / Trial Balance',type:'XLSX',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'348 KB',date:'14 Oct 2026',modified:14,preview:'Synthetic trial balance extract with account names and example balances.'},
{id:'D003',name:'Board Minutes Q2.pdf',folder:'Corporate Records / Meetings',type:'PDF',client:'BluePeak Technology',eng:'Internal Audit 2026',size:'1.2 MB',date:'12 Oct 2026',modified:12,preview:'Example board minutes concerning risk oversight and governance discussions.'},
{id:'D004',name:'Bank Confirmation - Sample.pdf',folder:'Confirmations / Banks',type:'PDF',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'561 KB',date:'10 Oct 2026',modified:10,preview:'Sample bank confirmation request and response. This is not real bank evidence.'},
{id:'D005',name:'Fixed Asset Register.xlsx',folder:'Accounts / Fixed Assets',type:'XLSX',client:'Cedar Retail Group',eng:'Due Diligence Q4',size:'922 KB',date:'9 Oct 2026',modified:9,preview:'Illustrative register of plant, equipment, acquisition dates and depreciation.'},
{id:'D006',name:'Internal Controls Walkthrough.docx',folder:'Internal Audit / Controls',type:'DOCX',client:'BluePeak Technology',eng:'Internal Audit 2026',size:'122 KB',date:'7 Oct 2026',modified:7,preview:'Example walkthrough narrative for order-to-cash and approval controls.'},
{id:'D007',name:'GST Reconciliation Working.xlsx',folder:'Indirect Tax / GST',type:'XLSX',client:'Cedar Retail Group',eng:'Due Diligence Q4',size:'735 KB',date:'6 Oct 2026',modified:6,preview:'Illustrative GST reconciliation schedule with intentionally synthetic figures.'},
{id:'D008',name:'Vendor Agreement - Sample.pdf',folder:'Contracts / Vendors',type:'PDF',client:'BluePeak Technology',eng:'Internal Audit 2026',size:'1.8 MB',date:'4 Oct 2026',modified:4,preview:'Sample contract clauses and vendor service-level terms.'},
{id:'D009',name:'Inventory Observation Notes.docx',folder:'Audit Evidence / Inventory',type:'DOCX',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'184 KB',date:'2 Oct 2026',modified:2,preview:'Illustrative inventory count attendance notes and sample exception observations.'},
{id:'D010',name:'Management Representation Letter.pdf',folder:'Closing / Representations',type:'PDF',client:'Meridian Manufacturing',eng:'Statutory Audit FY26',size:'410 KB',date:'1 Oct 2026',modified:1,preview:'Example management representation letter outline, not a signed or controlled document.'}
];
const clients=[{name:'Meridian Manufacturing',sector:'Manufacturing',count:6,status:'Active'},{name:'BluePeak Technology',sector:'Technology',count:3,status:'Active'},{name:'Cedar Retail Group',sector:'Retail',count:1,status:'Planning'}];
const state={page:'home',query:'',type:'All',client:null,engagement:null,doc:null,history:[],histIndex:-1,recent:[],pinned:new Set(),searches:[],modal:null,normalTab:'overview'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(page,{query=state.query,client=null,engagement=null,history=true}={}){if(history){state.history=state.history.slice(0,state.histIndex+1);state.history.push({page,query,client,engagement});state.histIndex=state.history.length-1;}state.page=page;state.query=query;state.client=client;state.engagement=engagement;state.type='All';state.modal=null;render();}
function back(){if(state.histIndex>0){state.histIndex--;const x=state.history[state.histIndex];Object.assign(state,x);state.type='All';state.modal=null;render();}}
function symbol(name,size=18){
 const paths={
  home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-8h6v8"/>',
  files:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12c5 4 13 4 18 0"/>',
  star:'<path d="m12 2 3.1 6.3 7 1-5 4.9 1.2 6.9-6.3-3.3-6.3 3.3 1.2-6.9-5-4.9 7-1z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  search:'<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/>',
  layers:'<path d="m12 2 9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/>',
  arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>',
  sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h8"/>'
 };
 return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.files}</svg>`;
}
function docRows(items){
 if(!items.length)return `<div class="empty">Nothing here yet. Try a different search or open a sample document.<div style="margin-top:15px"><button class="action secondary small" data-page="search">Browse documents</button></div></div>`;
 return `<div class="table-wrap"><table class="doc-table"><thead><tr><th>DOCUMENT</th><th class="hide-tablet">CLIENT</th><th class="hide-compact">UPDATED</th><th style="text-align:right">ACTIONS</th></tr></thead><tbody>${items.map(d=>`<tr><td><div class="file-cell"><span class="file-glyph ${d.type.toLowerCase()}" aria-hidden="true">${esc(d.type==='XLSX'?'XLS':d.type==='DOCX'?'DOC':'PDF')}</span><div style="min-width:0"><button class="filename filename-link" data-open="${d.id}">${esc(d.name)}</button><span class="path" title="${esc(d.folder)}">${esc(d.folder)}</span></div></div></td><td class="hide-tablet"><div class="meta strong client-meta">${esc(d.client)}</div><div class="path" style="max-width:220px">${esc(d.eng)}</div></td><td class="hide-compact"><span class="meta">${esc(d.date)}</span></td><td><div class="row-actions"><button class="action secondary small" data-open="${d.id}" aria-label="Preview ${esc(d.name)}">Open</button><button class="icon-btn ${state.pinned.has(d.id)?'pinned':''}" aria-label="${state.pinned.has(d.id)?'Unpin':'Pin'} ${esc(d.name)}" title="${state.pinned.has(d.id)?'Unpin':'Pin'}" data-pin="${d.id}">${state.pinned.has(d.id)?'★':'☆'}</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function title(head,sub,eyebrow='DOCUMENT WORKSPACE'){return `<p class="eyebrow">${esc(eyebrow)}</p><h1 class="heading">${esc(head)}</h1><p class="lead">${esc(sub)}</p>`;}
function notice(){return '';}
function home(){
 return `<div class="home-heading"><div><p class="eyebrow">WORKSPACE / OVERVIEW</p><h1 class="heading">Documents, within reach.</h1><p class="lead">The right file, at the right moment. Explore a focused workspace built for professional engagements.</p></div><div class="actions"><button class="action" data-page="search">Browse documents &nbsp;→</button></div></div>
 <section class="overview-line" aria-label="Sample workspace summary"><div class="overview-metric"><strong>${docs.length}</strong><span>Sample documents</span></div><div class="overview-metric"><strong>${clients.length}</strong><span>Client workspaces</span></div><div class="overview-metric"><strong>${state.recent.length}</strong><span>Recently opened</span></div><div class="overview-metric"><strong>${state.pinned.size}</strong><span>Pinned for access</span></div></section>
 <div class="section-header"><h2>Recently updated</h2><button data-page="search">View all documents &nbsp;→</button></div>
 <section class="card" aria-label="Recently updated sample documents">${docRows(docs.slice(0,5))}</section>
 <div class="section-header"><h2>Explore your workspace</h2></div>
 <div class="secondary-links"><button class="secondary-link" data-page="clients"><span class="secondary-symbol">${symbol('users',17)}</span><span><strong>Clients</strong><small>Browse records by organization</small></span></button><button class="secondary-link" data-page="engagements"><span class="secondary-symbol">${symbol('briefcase',17)}</span><span><strong>Engagements</strong><small>Find evidence by engagement</small></span></button><button class="secondary-link" data-page="pinned"><span class="secondary-symbol">${symbol('star',17)}</span><span><strong>Pinned documents</strong><small>Your shortcuts in one place</small></span></button></div>`;
}
function filteredDocs(){const q=state.query.trim().toLowerCase();return docs.filter(d=>(state.type==='All'||d.type===state.type)&&(!state.client||d.client===state.client)&&(!state.engagement||d.eng===state.engagement)&&(!q||[d.name,d.folder,d.client,d.eng,d.type].some(x=>x.toLowerCase().includes(q))));}
function results(){
 const items=filteredDocs();
 return title(state.query?`Search results`:'Document library',state.query?`${items.length} document${items.length===1?'':'s'} matching “${state.query}”`:'Browse and open sample documents across your workspace.','LIBRARY / DOCUMENTS')+`<div class="mini-filters">${['All','PDF','XLSX','DOCX'].map(t=>`<button class="filter ${state.type===t?'selected':''}" data-type="${t}" aria-pressed="${state.type===t}">${t==='All'?'All files':t}</button>`).join('')}<span class="meta" style="margin-left:auto">${items.length} document${items.length===1?'':'s'}</span></div><section class="card"><div class="card-header"><h2>${state.query?'Matching documents':'All documents'}</h2><small>Click a filename to preview</small></div>${docRows(items)}</section>`;
}
function recent(){const list=state.recent.map(id=>docs.find(d=>d.id===id)).filter(Boolean);return title('Recent documents','Every sample preview you open appears here until you reload the page.','YOUR ACTIVITY')+notice()+`<div class="card"><div class="card-header"><h2>Recently opened</h2><small>${list.length} documents</small></div>${docRows(list)}</div>`;}
function pinned(){const list=docs.filter(d=>state.pinned.has(d.id));return title('Pinned documents','Quick access to the documents you want to keep close.','YOUR COLLECTION')+notice()+`<div class="card"><div class="card-header"><h2>Your pins</h2><small>${list.length} pinned</small></div>${docRows(list)}</div>`;}
function searches(){return title('Recent searches','Click any search to run it again against the sample index.','SEARCH HISTORY')+notice()+`<div class="card"><div class="card-header"><h2>Searches in this session</h2><small>${state.searches.length} unique queries</small></div>${state.searches.length?state.searches.map(q=>`<div class="searchhist"><div><strong>${esc(q)}</strong><p>Sample document-index lookup</p></div><button class="action secondary small" data-search="${esc(q)}">Search again →</button></div>`).join(''):`<div class="empty">Try a search in the top bar to populate this page.</div>`}</div>`;}
function clientsPage(){return title('Clients','Organize the document library around the organizations you serve.','ENGAGEMENT DIRECTORY')+notice()+`<div class="grid2">${clients.map(c=>`<button class="client-card" data-client="${esc(c.name)}"><h3>${esc(c.name)} →</h3><p>${esc(c.sector)} · ${esc(c.status)} client</p><div class="lower"><span>${docs.filter(d=>d.client===c.name).length} indexed documents</span><span>View workspace →</span></div></button>`).join('')}</div>`;}
function clientDetail(){const c=clients.find(x=>x.name===state.client);const items=docs.filter(d=>d.client===state.client);return title(c?.name||'Client',`${c?.sector||'Client'} workspace with linked sample documents and engagements.`,'CLIENT WORKSPACE')+notice()+`<div class="actions" style="margin-bottom:17px"><button class="action secondary" data-page="clients">← All clients</button><button class="action" data-page="engagements">Explore engagements</button></div><div class="card"><div class="card-header"><h2>Related documents</h2><small>${items.length} items</small></div>${docRows(items)}</div>`;}
function engagements(){const e=[...new Set(docs.map(x=>x.eng))];return title('Engagements','Choose a professional engagement and explore its example document records.','WORKSPACE DIRECTORY')+notice()+`<div class="grid2">${e.map(n=>`<button class="client-card" data-engagement="${esc(n)}"><span class="pill">Example engagement</span><h3 style="margin-top:15px">${esc(n)} →</h3><p>${docs.filter(d=>d.eng===n).length} example documents linked</p><div class="lower"><span>Open workspace</span><span>→</span></div></button>`).join('')}</div>`;}
function engagementDetail(){let items=docs.filter(d=>d.eng===state.engagement);return title(state.engagement||'Engagement','Linked example evidence and account schedules.','ENGAGEMENT WORKSPACE')+notice()+`<div class="actions" style="margin-bottom:17px"><button class="action secondary" data-page="engagements">← All engagements</button></div><div class="card"><div class="card-header"><h2>Documents</h2><small>${items.length} items</small></div>${docRows(items)}</div><div class="safe">Workpaper sign-offs, evidence capture, native indexing and controlled versions are intentionally not simulated as real actions.</div>`;}
function normalData(){
 return title('Normal Data','A sample-only field comparison. This is not a ledger import, reconciliation, or audit conclusion.','WORKSPACES / NORMAL DATA')+`<section class="card"><div class="card-header"><h2>Reference comparison</h2><small>Illustrative · local only</small></div><div style="padding:24px"><div class="compare-grid"><div class="compare-box"><h3>EXAMPLE DOCUMENT</h3><span class="meta">Voucher reference</span><div style="margin:8px 0"><strong>INV-100</strong></div><p>Amount &nbsp; ₹12,500.00<br>Client &nbsp; Example Corporation</p></div><div class="compare-box"><h3>EXAMPLE BOOK ENTRY</h3><span class="meta">Reference number</span><div style="margin:8px 0"><strong>INV-100</strong></div><p>Amount &nbsp; ₹12,200.00<br>Client &nbsp; Example Corporation</p></div></div><div class="actions" style="margin:20px 0 0"><button class="action" id="compare-example">Compare sample values</button><button class="action secondary" id="clear-example">Clear result</button></div><div id="comparison-result" class="muted" role="status" aria-live="polite" style="font-size:12px;margin-top:18px">No comparison requested.</div></div></section><div class="safe">Sample comparison is advisory only. Nothing is saved or changed in any document or accounting record.</div>`;
}
function preview(id){let d=docs.find(x=>x.id===id);if(!d)return;state.modal=id;if(!state.recent.includes(id))state.recent.unshift(id);state.recent=state.recent.slice(0,10);render();}
function modalHtml(){
 if(!state.modal)return '';
 let d=docs.find(x=>x.id===state.modal);if(!d)return '';
 return `<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><p class="eyebrow" style="margin-bottom:8px">DOCUMENT / SAMPLE PREVIEW</p><h2 id="modal-title">${esc(d.name)}</h2><span class="path" style="max-width:690px;white-space:normal">${esc(d.folder)}</span></div><button class="close" id="close-modal" aria-label="Close preview">×</button></header><div class="modal-body"><div class="preview-layout"><div class="preview"><article class="preview-paper"><span class="eyebrow">PROFESSIONAL DOCX · ILLUSTRATIVE DOCUMENT</span><h3>${esc(d.name.replace(/\.(pdf|xlsx|docx)$/i,''))}</h3><p>${esc(d.preview)}</p><div class="fake-line" style="width:94%"></div><div class="fake-line" style="width:81%"></div><div class="fake-line" style="width:91%"></div><div class="fake-line" style="width:62%"></div><p class="dim" style="margin-top:36px;font-size:10.5px">Sample content for evaluating the interface only.</p></article></div><aside class="preview-details" aria-label="Document details"><h3>Document details</h3><div class="meta-pair"><span>File type</span><strong>${esc(d.type)}</strong></div><div class="meta-pair"><span>Client</span><strong>${esc(d.client)}</strong></div><div class="meta-pair"><span>Engagement</span><strong>${esc(d.eng)}</strong></div><div class="meta-pair"><span>Size</span><strong>${esc(d.size)}</strong></div><div class="meta-pair"><span>Last updated</span><strong>${esc(d.date)}</strong></div><div class="preview-aside-notice">Simulated preview; actual PDF, Office and file-version features require the desktop service. No real file is opened.</div></aside></div><div class="modal-foot"><div class="actions"><button class="action secondary" data-pin="${d.id}">${state.pinned.has(d.id)?'★ Remove pin':'☆ Pin for later'}</button><button class="action secondary" id="version-example">Version history</button></div><button class="action" id="done-preview">Close preview</button></div></div></section></div>`;
}
function content(){if(state.page==='home'&&!state.query)return home();if(state.page==='search'||state.query)return results();if(state.page==='recent')return recent();if(state.page==='pinned')return pinned();if(state.page==='searches')return searches();if(state.page==='clients')return state.client?clientDetail():clientsPage();if(state.page==='engagements')return state.engagement?engagementDetail():engagements();if(state.page==='normal-data')return normalData();return home();}
const libraryMenu=[['home','home','Overview'],['search','files','All documents'],['recent','clock','Recent'],['pinned','star','Pinned']];
const workplaceMenu=[['clients','users','Clients'],['engagements','briefcase','Engagements'],['normal-data','layers','Normal Data']];
const activityMenu=[['searches','search','Recent searches']];
function menuHtml(entries){return entries.map(([id,ic,label])=>`<button type="button" title="${label}" data-page="${id}" class="${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}><span class="nav-icon">${symbol(ic,17)}</span><span class="nav-label">${label}</span>${id==='recent'&&state.recent.length?`<span class="count">${state.recent.length}</span>`:''}${id==='pinned'&&state.pinned.size?`<span class="count">${state.pinned.size}</span>`:''}</button>`).join('');}
function breadcrumb(){
 if(state.query)return 'Search results';
 if(state.client)return state.client;
 if(state.engagement)return state.engagement;
 return ({home:'Overview',search:'All documents',recent:'Recent',pinned:'Pinned',clients:'Clients',engagements:'Engagements','normal-data':'Normal Data',searches:'Recent searches'})[state.page]||'Overview';
}
function render(){
 document.title='Professional DocX · Browser Test Drive';
 document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar" aria-label="Primary navigation"><div class="brand"><div class="brand-mark">PD</div><div><strong>Professional DocX</strong><span>DOCUMENT WORKSPACE</span></div></div><p class="side-head">LIBRARY</p><nav class="nav" aria-label="Library">${menuHtml(libraryMenu)}</nav><p class="side-head">WORKSPACES</p><nav class="nav" aria-label="Workspaces">${menuHtml(workplaceMenu)}</nav><p class="side-head">ACTIVITY</p><nav class="nav" aria-label="Activity">${menuHtml(activityMenu)}</nav><div class="side-bottom"><b>Preview environment</b><span class="sidebar-tiny">Fictional data · Local session</span></div></aside><main class="main"><header class="topbar"><button class="navback" title="Go back" aria-label="Go back" id="back" ${state.histIndex<=0?'disabled':''}>←</button><div class="breadcrumbs"><span>Workspace</span><span class="crumb-divider">/</span><span class="crumb-current">${esc(breadcrumb())}</span></div><div class="top-spacer"></div><label class="search-box"><span class="search-svg">${symbol('search',16)}</span><span class="sr-only">Search sample documents</span><input id="global-search" type="search" placeholder="Search documents, clients, folders…" value="${esc(state.query)}" autocomplete="off"><kbd class="kbd">Ctrl K</kbd></label><span class="demo-pill">SAMPLE DATA</span></header><div class="workspace">${content()}<footer class="footer">Professional DocX · Interactive prototype using fictional records. Your documents, native storage, permissions and audit evidence are not connected. All actions reset on refresh.</footer></div></main></div>${modalHtml()}`;
 attach();
}
function query(q){q=q.trim();if(q&&!state.searches.includes(q))state.searches.unshift(q);nav('search',{query:q});}
function attach(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.page,{query:'',client:null,engagement:null})));document.querySelectorAll('[data-search]').forEach(el=>el.addEventListener('click',()=>query(el.dataset.search)));document.querySelectorAll('[data-client]').forEach(el=>el.addEventListener('click',()=>nav('clients',{query:'',client:el.dataset.client})));document.querySelectorAll('[data-engagement]').forEach(el=>el.addEventListener('click',()=>nav('engagements',{query:'',engagement:el.dataset.engagement})));document.querySelectorAll('[data-pin]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.pin;state.pinned.has(id)?state.pinned.delete(id):state.pinned.add(id);render();}));document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>preview(el.dataset.open)));document.querySelectorAll('[data-type]').forEach(el=>el.addEventListener('click',()=>{state.type=el.dataset.type;render()}));let input=$('#global-search');input.addEventListener('input',()=>{state.query=input.value;state.page='search';let pos=input.selectionStart;render();let newI=$('#global-search');newI.focus();newI.setSelectionRange(pos,pos);});input.addEventListener('keydown',e=>{if(e.key==='Enter'){query(e.target.value);e.target.blur()}});let b=$('#back');if(b)b.addEventListener('click',back);let c=$('#close-modal');if(c)c.addEventListener('click',()=>{state.modal=null;render()});let done=$('#done-preview');if(done)done.addEventListener('click',()=>{state.modal=null;render()});let backdrop=$('#modal-backdrop');if(backdrop)backdrop.addEventListener('click',e=>{if(e.target===backdrop){state.modal=null;render()}});let v=$('#version-example');if(v)v.addEventListener('click',()=>alert('Browser demo: no verified source/version history is available. Real history requires the native document service.'));let n=$('#compare-example');if(n)n.addEventListener('click',()=>{$('#comparison-result').innerHTML='<div class="safe"><strong>Difference to review · ₹300.00</strong><div style="margin-top:5px">Document: ₹12,500.00 &nbsp; / &nbsp; Reference: ₹12,200.00. Advisory only; no records are modified.</div></div>';});let clear=$('#clear-example');if(clear)clear.addEventListener('click',()=>{$('#comparison-result').textContent='No comparison requested.'});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.modal=null;render();$('#global-search').focus();}});
state.history.push({page:'home',query:'',client:null,engagement:null});state.histIndex=0;render();
</script>
